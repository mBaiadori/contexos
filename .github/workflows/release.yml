name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build Server
        run: cd server && npm run build

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package & Publish Windows Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          npm run build
          npm run compile:bytecode
          npm run package:win -- --publish always

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-bundle
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
          if-no-files-found: warn
          retention-days: 14

  release-mac:
    name: Build & Publish macOS Release
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci

      - name: Build Server
        run: cd server && npm run build

      - name: Build Frontend
        run: cd frontend && npm run build

      - name: Package & Publish macOS Bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop
          npm run build
          npm run compile:bytecode
          npm run package:mac -- --publish always

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-release-bundle
          path: |
            desktop/release/*.pkg
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/latest-mac.yml
          if-no-files-found: warn
          retention-days: 14

  publish-release:
    name: Finalize & Publish Release
    needs: [release-windows, release-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "Publicando release oficial para a tag ${{ github.ref_name }}..."
            gh release edit "${{ github.ref_name }}" --draft=false --latest
          fi


