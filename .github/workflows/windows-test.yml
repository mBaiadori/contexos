name: Windows Cloud Installer Test

on:
  workflow_dispatch:
    inputs:
      test_repo_clone:
        description: 'Test cloning a remote repository with bundled Git'
        required: false
        type: boolean
        default: true

jobs:
  test-installer:
    name: Build, Install & Verify on Clean Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install Dependencies
        run: |
          cd server && npm ci
          cd ../frontend && npm ci
          cd ../desktop && npm ci

      - name: Build Server & Frontend
        run: |
          cd server && npm run build
          cd ../frontend && npm run build

      - name: Package Windows Desktop App
        run: |
          cd desktop
          npm run build
          npm run compile:bytecode
          npm run package:win -- --publish never

      - name: Smoke Test - Execute Silent Installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/release/*.exe | Select-Object -First 1
          if (-not $installer) {
            throw "Erro: Instalador .exe não foi encontrado em desktop/release/"
          }
          $defaultUserDir = "$env:LOCALAPPDATA\Programs\Contexos"
          Write-Host "Executando instalador oficial: $($installer.FullName)..."
          
          # Executa o instalador NSIS em modo estritamente silencioso
          # No Windows, executando como Administrador (runneradmin), passamos /currentuser e /D para garantir destino esperado
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S /currentuser /D=$defaultUserDir" -PassThru
          
          # Resolução resiliente dos caminhos candidatos de instalação (per-user e per-machine)
          $candidateDirs = @(
            $defaultUserDir,
            "$env:ProgramFiles\Contexos",
            "${env:ProgramFiles(x86)}\Contexos"
          )

          $foundDir = $null
          $timeout = 120

          while ($timeout -gt 0) {
            foreach ($dir in $candidateDirs) {
              $appCandidate = Join-Path $dir "Contexos.exe"
              $gitCandidate = Join-Path $dir "resources\git\cmd\git.exe"
              if ((Test-Path $appCandidate) -and (Test-Path $gitCandidate)) {
                $foundDir = $dir
                break
              }
            }
            if ($foundDir) {
              Start-Sleep -Seconds 5
              break
            }
            Start-Sleep -Seconds 2
            $timeout -= 2
          }

          if (-not $foundDir) {
            Write-Host "Conteúdo de $env:LOCALAPPDATA\Programs:"
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object Name
            Write-Host "Conteúdo de $env:ProgramFiles:"
            Get-ChildItem -Path "$env:ProgramFiles" -ErrorAction SilentlyContinue | Select-Object Name
            throw "Falha: O diretório de instalação do Contexos não foi encontrado em nenhum local esperado!"
          }

          $installDir = $foundDir
          $appExe = Join-Path $installDir "Contexos.exe"
          $gitExe = Join-Path $installDir "resources\git\cmd\git.exe"

          Write-Host "Verificando diretório de instalação: $installDir"
          Write-Host "✅ Executável principal verificado: $appExe"
          Write-Host "✅ MinGit embutido verificado: $gitExe"

          $version = & $gitExe --version
          Write-Host "Versão do Git: $version"

          if ("${{ inputs.test_repo_clone }}" -eq "true") {
            Write-Host "Testando operação de Git clone usando o Git embutido..."
            $testDir = Join-Path $env:TEMP "cloud-test-git"
            & $gitExe init $testDir
            Write-Host "✅ Git init funcionou 100% no ambiente Windows limpo!"
          }

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: Context-OS-Windows-Setup
          path: desktop/release/*.exe
          retention-days: 14
